# KBUtilLib Configuration File
# This file demonstrates the configuration format expected by SharedEnvironment

# KBase Configuration
kbase:
  url: "https://kbase.us/services"
  auth_token: "" # Set via environment variable KB_AUTH_TOKEN

# Service URLs
urls:
  kbase_api: "https://kbase.us/services"
  narrative: "https://narrative.kbase.us"
  search: "https://search.kbase.us"

# SDK Configuration
sdk:
  module_dir: "/kb/module"
  callback_url: "" # Set via environment variable SDK_CALLBACK_URL

# Workspace Configuration
workspace-url: "https://kbase.us/services/ws"
max_retry: 3
scratch: "/tmp"

# Mass Spectrometry Settings
ms:
  default_ppm_tolerance: 10.0
  default_da_tolerance: 0.01

# Notebook Settings
notebook:
  auto_display: true
  max_display_rows: 100
  max_display_cols: 20

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Model Analysis Settings
modeling:
  default_objective: "bio1"
  fba_timeout: 300

# File Paths
paths:
  data_dir: "./data"
  output_dir: "./output"
  cache_dir: "./cache"

# SKANI Configuration
skani:
  executable: "skani"  # Path to skani executable, or "skani" if in PATH
  cache_file: "~/.kbutillib/skani_databases.json"  # JSON file tracking sketch databases

# AI Curation Configuration
ai_curation:
  backend: "argo"  # AI backend: "argo" or "claude-code"
  claude_code_executable: "claude-code"  # Path to claude-code executable if using claude-code backend

# Transyt Configuration (transport-reaction annotation via Docker)
transyt:
  docker_image: "merlin-sysbio/kb_transyt:latest"  # Docker image tag/digest for Transyt
  neo4j_timeout: 120  # Maximum seconds to wait for Neo4j readiness before launching JAR

# Remote LP-Solver service (client + service, see
# agent-io/prds/remote-lp-solver/fullprompt.md). Every key below is the
# documented default applied when the key is unset.
remote_solver:
  base_url: "http://127.0.0.1:8091"  # client: SSH-tunnel local forward target
  timeout: 30.0  # client: HTTP request timeout (seconds)
  poll_interval: 2.0  # client: GET /result poll cadence (+/-10% jitter)
  api_key: ""  # optional x-api-key; checked only when non-empty
  max_concurrent_solves: 5  # service: bounded solve pool size
  max_queue_depth: 50  # service: queued-job backstop (running excluded)
  threads_per_solve: null  # service: null -> floor(cpu_count / max_concurrent_solves)
  default_time_limit: 3600  # service: applied when a solve omits time_limit
  max_time_limit: 7200  # service: ceiling caller time_limit values are clamped to

# Highest-priority MINE-Database reaction-rule TSV location; empty falls back to $KBUTILLIB_PICKAXE_DATA_DIR, installed minedatabase data, or the MINE-Database checkout in dependencies.yaml.
cheminformatics:
  pickaxe:
    data_dir: ""
