server {
    listen 80;
    server_name _;   # catches any hostname; replace with e.g. "poplar.example.com" if desired

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reasonable timeouts for long-running tool calls
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # No auth — open/public usage on internal shared server (Poplar)
        # To add HTTP basic auth later:
        #   auth_basic "KBUtilLib API";
        #   auth_basic_user_file /etc/nginx/.htpasswd;
        # To add bearer token auth, delegate to the FastAPI auth layer or use
        # an nginx auth_request sub-request to a sidecar auth service.
    }
}
