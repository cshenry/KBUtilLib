site_name: KBUtilLib
site_description: "A modular utility framework for scientific computing and bioinformatics"
site_url: https://KBUtilLib.readthedocs.io
repo_url: https://github.com/cshenry/KBUtilLib
repo_name: cshenry/KBUtilLib

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: usage.md
  - Capabilities:
      - Catalog: capabilities/index.md
  - MCP Catalog: mcp-catalog.md
  - API Reference: reference.md
  - Migration Guide: MIGRATION_GUIDE.md
  - Contributing: contributing.md
  - Code of Conduct: code_of_conduct.md

docs_dir: docs
site_dir: site
