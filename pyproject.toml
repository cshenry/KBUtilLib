[project]
name = "KBUtilLib"
version = "1.0.0"
description = "KBUtilLib"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Christopher Henry", email = "chenry@anl.gov"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
]

dependencies = [
"aiohttp >=3.9",
"click >=8.0.1",
"nbformat >=5.7",
"nox",
"pydantic >=2.0",
"pyarrow >=12.0",
"PyYAML >=6.0",
"requests >=2.25.0",
"requests_toolbelt >=0.10.0",
"jinja2 >=3.0",
"tomli-w >=1.0",
"tomli >=2.0 ; python_version < '3.11'",
"httpx[socks] >=0.28",

]


[project.optional-dependencies]
# Test/dev dependencies, duplicated from [dependency-groups].dev below.
# BOTH are required and neither is redundant: PEP 735 dependency-groups are
# reachable by `uv sync --group dev` but NOT by pip extras, and .github/
# workflows/ci.yml installs with `pip install -e ".[dev]"`. Declaring `dev`
# only as a group made pip warn "does not provide the extra 'dev'", install
# nothing, and fail one second later with `No module named pytest` -- which
# is why CI had never been green. If you edit one list, edit the other.
dev = [
  "pytest >=6.2.5",
  "pytest-cov >=4.0",
  "coverage[toml] >=6.2",
  "pandas >=1.3.0",
  "ipykernel >=6.0",  # provides the python3 kernelspec that tests/harness notebook execution needs
]
# Transport adapters (kept optional so `import kbutillib` and the core library
# never require these heavy server deps). Install with e.g. `pip install .[mcp]`.
mcp = [
  "mcp >=1.27,<2 ; python_version >= '3.10'",
]
api = [
  "fastapi >=0.110",
  "uvicorn[standard] >=0.29",
]
# httpx client used by ArgoUtils/AICurationUtils (domains.ai.*, SOCKS5-tunnelled
# ARGO gateway calls) and by the Remote LP-Solver client (domains.modeling.
# ms_remote_solver_utils, plain HTTP to the lp-solver service). Kept optional
# so `import kbutillib` and the core modeling/notebook install never require
# httpx -- both call sites are behind lazy properties / try-except-ImportError
# re-exports in toolkit.py and __init__.py, so a core install degrades
# gracefully instead of crashing when httpx is absent.
ai = [
  "httpx[socks] >=0.28",
]
# Remote LP-Solver service runtime deps (kbutillib/services/lp_solver/app.py).
# Deployed into a dedicated venv (~/venvs/lp-solver) per
# agent-io/prds/remote-lp-solver/fullprompt.md "Deployment on H100", not
# required for a plain KBUtilLib install or for the client side (see `ai`).
lp_solver = [
  "fastapi >=0.110",
  "uvicorn[standard] >=0.29",
]
# Auto-generated API docs from the capability registry + docstrings.
apidocs = [
  "mkdocs-material >=9.5",
  "mkdocstrings[python] >=0.24",
]
# Everything needed to run all transports + build docs.
all = [
  "mcp >=1.27,<2 ; python_version >= '3.10'",
  "fastapi >=0.110",
  "uvicorn[standard] >=0.29",
  "httpx[socks] >=0.28",
  "mkdocs-material >=9.5",
  "mkdocstrings[python] >=0.24",
]

[project.urls]
Homepage = "https://github.com/cshenry/KBUtilLib"
Repository = "https://github.com/cshenry/KBUtilLib"
Documentation = "https://KBUtilLib.readthedocs.io"
Changelog = "https://github.com/cshenry/KBUtilLib/releases"

[dependency-groups]
dev = [
  "coverage[toml] >= 6.2",
  "pytest-cov >=4.0",
  "pandas >=1.3.0",
  "pre-commit >=2.16.0",
  "pre-commit-hooks >=4.6.0",
  "pytest >=6.2.5",
  "pygments >=2.10.0",
  "pandas >=1.3.0",
  "ipykernel >=6.0",

]
lint = [
  "ruff >=0.5.5",
  "pydoclint >=0.5.0",
]
docs = [
  "furo >=2021.11.12",
  "myst-parser == 3.0.1",
  "sphinx >= 4.3.2",
  "sphinx-autobuild >=2021.3.14",
  "sphinx-click >=3.0.2",
]
mypy = [
  "mypy >=0.930"
]
typeguard = [
  "typeguard >=2.13.3"
]
xdoctest = [
  "xdoctest[colors] >=0.15.10"
]
notebook = [
  "ipywidgets >=8.0.0",
  "itables >=1.5.0",
  "jupyter",
  "ipykernel",
  "pandas >=1.3.0",
  "tqdm >=4.64.0",
]
lp_solver = [
  # Remote LP-Solver service runtime deps (kbutillib/services/lp_solver/app.py).
  # Deployed into a dedicated venv (~/venvs/lp-solver) per
  # agent-io/prds/remote-lp-solver/fullprompt.md "Deployment on H100", not
  # required for a plain KBUtilLib install.
  "fastapi >=0.100",
  "uvicorn >=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The KIND self-install app bundles (kbu kind install) -- package data so a
# `pip install` (not just an editable install) still ships each bundle.json +
# skill.md alongside the kbutillib package.
kbutillib = [
    "kind_app/*.json", "kind_app/*.md",
    "kind_app/verab/*.json", "kind_app/verab/*.md",
    "kind_app_wake/*.json", "kind_app_wake/*.md",
]

[tool.uv]
package = true

[project.scripts]
kbu = "kbutillib.__main__:main"
kbu-mcp = "kbutillib.interfaces.mcp.server:main"
kbu-api = "kbutillib.interfaces.api.app:main"

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["kbutillib", "tests"]

[tool.coverage.report]
show_missing = true
# Coverage is REPORTED by the pytest jobs but GATED here, in the dedicated
# coverage job. ci.yml passes --cov-fail-under=0 so a shortfall never fails a
# test run (Chris's call, 2026-08-20).
#
# This is a NO-REGRESSION RATCHET, not an aspiration. Measured total on
# 2026-08-21 was 40% (30065 statements, 16651 missed); 39 leaves a point of
# slack so an unrelated PR does not go red over rounding. Raise it deliberately
# as coverage improves -- that is the whole point of a ratchet.
#
# It was previously 100 against ~40% real coverage, enforced inline in the test
# run, so every PR was red regardless of its content. That is a large part of
# why this repo's CI had never been green in 73 recorded runs.
fail_under = 39
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
markers = [
    "slow: mark test as slow running",
    "integration: mark test as integration test",
    "kbase: mark test as requiring a live KBase token (skipped unless KBASE_LIVE_TESTS=1)",
    "kbu_model: mark test as requiring the kbu modeling stack (cobra/modelseedpy); skipped when unavailable",
    "kind_install: mark test as covering the `kbu kind` KIND self-install verb group",
]

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_context = true

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "W",    # pycodestyle warnings
]
ignore = [
  "E501",  # line too long (let ruff-format handle this)
  "E711",  # comparison to None should use is/is not
  "E722",  # do not use bare except
  # F821 (undefined name) is deliberately NOT ignored. It was, on the rationale
  # that it is "common in generated/client code" -- but installed_clients/ has
  # zero F821 hits, so the ignore only ever hid real bugs in hand-written code:
  # an undefined `genome` that made kb_gapfill_metabolic_models raise NameError
  # on every call, undefined json/os in kb_sdk_utils, and an undefined met_id.
  # Each was a guaranteed crash on the path that reached it.
  "F841",  # local variable assigned but never used
]

[tool.ruff.lint.per-file-ignores]
"*/test_*.py" = ["S101"]
"noxfile.py" = ["S101"]
"**/conftest.py" = ["S101"]
