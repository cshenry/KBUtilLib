# Packaged default council configuration.
#
# Shipped as package data, so a fresh KBUtilLib install with no user config at
# all still has a working council. Override any entry from the `ai_council`
# section of ~/.kbutillib/config.yaml -- the user's keys win per endpoint,
# model and profile entry; entries they do not name are untouched.

endpoints:
  # ANL's ARGO gateway. OpenAI-compatible, and the only route that reaches
  # Gemini. ARGO authenticates by ANL username rather than an API key, which
  # is what user_env carries; proxy is empty unless the operator sets
  # KBU_ARGO_PROXY (ARGO is inside the lab network).
  argo:
    kind: argo
    base_url: https://apps.inside.anl.gov/argoapi/v1
    user_env: ARGO_USER
    proxy: ${KBU_ARGO_PROXY:-}

  # Headless CLIs. Both bill against an interactive subscription, not an API
  # key, so max_concurrency defaults to 1 for each: a CLI call is a
  # subprocess against one logged-in session, not a pooled API.
  claude:
    kind: claude_cli
    executable: claude
    account: claude-max
  codex:
    kind: codex_cli
    executable: codex
    account: codex-chatgpt

  # A SELF-HOSTED model is just an OpenAI-compatible endpoint you declare
  # yourself -- the council manages no models and knows no GPUs (review round
  # 2 took that out of the product). Nothing self-hosted is packaged here,
  # because a port that is up on one machine is not up on another. Uncomment
  # and edit, or put the same three lines in the `ai_council` section of
  # ~/.kbutillib/config.yaml, then seat the alias in a profile:
  #
  # my-vllm:
  #   kind: openai
  #   base_url: http://127.0.0.1:8000/v1
  #   api_key_env: MY_VLLM_API_KEY     # optional; vLLM ignores the value
  #                                    # unless it was started with --api-key

  # A gateway that routes on a HEADER rather than on the URL. The Genesis
  # Model Access Gateway (MAG) is OpenAI-compatible and picks which provider
  # to forward to from X-AmSC-MAG-Provider, so the provider travels in
  # options.headers -- a mapping of static, NON-SECRET headers sent on every
  # request this endpoint makes (both /chat/completions and /models). The
  # bearer token is NOT one of them: it comes from api_key_env, as always,
  # and a credential-shaped header name is refused at config load.
  #
  # The provider value below and the model ids to seat against it are NOT
  # guessed here: take both from the MyAmSC portal's MAG documentation for
  # your account, then declare the aliases under `models:` yourself with
  # `verified: false` until `kbu council doctor` has confirmed them. (That
  # key belongs to a model entry, not to an endpoint -- an endpoint has no
  # `verified` key and would warn and drop it.)
  #
  # mag:
  #   kind: openai
  #   base_url: https://mag.genesis.americansciencecloud.org/v1
  #   api_key_env: AMSC_TOKEN
  #   options:
  #     headers:
  #       X-AmSC-MAG-Provider: <provider>   # from the MyAmSC portal docs

  # ANTHROPIC'S OWN API (kind: anthropic) -- a fixed API credit spent through
  # POST /v1/messages. Needs `pip install 'kbutillib[anthropic]'` (Python >=
  # 3.10) and an API key in the variable api_key_env names; nothing else
  # carries the key. base_url is omitted: it defaults to
  # https://api.anthropic.com.
  #
  # ONE ALIAS PER RATE-LIMIT BUCKET -- not one per wallet, not one per model.
  # The `account` key names the RATE-LIMIT BUCKET, not the wallet. Anthropic
  # enforces requests/min and input/output tokens/min PER MODEL-CLASS BUCKET:
  # Opus 5, Sonnet 5 and Haiku 4.5 each hold a separate allowance, Opus
  # 4.8/4.7/4.6/4.5 share one, Sonnet 4.6/4.5 share another. The same
  # `account` key groups the engine's semaphore and rate pacer AND buckets the
  # dollar quote, so naming it after the wallet would throttle the run to the
  # slowest model's rate, and naming it per model would split one shared
  # allowance into independent pools -- which is how the 2026-10-21 MAG pilot
  # errored 427 of 500 items. Config load REFUSES an account that is not the
  # bucket name; billing_wallet names the payer (one value for every alias
  # paid from the same credit).
  #
  # The per-minute RATE binds before the parallel cap on this provider, so
  # max_requests_per_minute is the number to set (from your console's limits
  # page, or measured -- see the operator runbook) and max_concurrency
  # defaults low (4).
  #
  # max_total_tokens is PER ENDPOINT. Several aliases mean several budgets and
  # NOTHING SUMS THEM: a single fixed wallet is not expressible as one enforced
  # ceiling today. Setting a budget on each alias does not protect the wallet
  # as a whole -- fence it with a console spend limit as well.
  #
  # A seat's max_output_tokens must cover THINKING PLUS THE ANSWER. Thinking is
  # on by default and adaptive on the current Claude models, its tokens are
  # billed and counted as OUTPUT, and the seat default of 4000 is often not
  # enough; a truncated answer is a wasted call. `effort` may be passed in a
  # model's params to trade depth against spend; no value is chosen here.
  #
  # NO SAMPLING PARAMETER IS SENT BY DEFAULT: the current Claude models reject
  # temperature, top_p and top_k with HTTP 400. On a model that accepts them, a
  # seat may set one explicitly in its params -- the provider's default is
  # 1.0, not 0.
  #
  # This credit is a SECOND WALLET AT THE SAME PRICE, NOT A DISCOUNT: ARGO was
  # measured billing Claude at vendor list within 1.5% on the 2026-10-20 bill.
  # What it buys is independence from the ARGO cap and models ARGO does not
  # serve. ARGO already serves Sonnet 5 and Opus 5 under the SAME canonical
  # identity, so a roster cannot seat both routes for one model --
  # Roster._check_independence refuses it, deliberately, because that is what
  # stops one model being counted as two votes. The models this wallet newly
  # makes seatable are Haiku 4.5 and Sonnet 4.6.
  #
  # Dollar quotes: `rates` may be keyed per model as
  # "<account>/<canonical-model>", falling back to "<account>", and every rate
  # must carry a provenance. Claude Haiku 5.5's input pricing is TIERED BY
  # PROMPT SIZE, which a single input_per_mtok cannot express -- do not declare
  # a rate for it and expect an exact quote.
  #
  # anthropic-haiku:
  #   kind: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  #   billing: api
  #   account: anthropic-haiku-4.5          # = the bucket name, enforced
  #   billing_wallet: anthropic-credit
  #   max_concurrency: 4
  #   max_requests_per_minute: <rpm>        # your console's limit for this bucket
  # anthropic-sonnet4:
  #   kind: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  #   billing: api
  #   account: anthropic-sonnet-4           # Sonnet 4.6 / 4.5 share this bucket
  #   billing_wallet: anthropic-credit
  #   max_concurrency: 4
  #   max_requests_per_minute: <rpm>
  # anthropic-opus4:
  #   kind: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  #   billing: api
  #   account: anthropic-opus-4             # Opus 4.8 / 4.7 / 4.6 / 4.5 share this bucket
  #   billing_wallet: anthropic-credit
  #   max_concurrency: 4
  #   max_requests_per_minute: <rpm>
  #
  # ...with matching entries under `models:` (canonical identity comes from the
  # built-in DEFAULT_CANONICAL_BY_KIND["anthropic"] table):
  #
  #   haiku45-api:
  #     endpoint: anthropic-haiku
  #     served_name: claude-haiku-4-5
  #     params: {max_output_tokens: 16000}
  #   sonnet46-api:
  #     endpoint: anthropic-sonnet4
  #     served_name: claude-sonnet-4-6
  #   opus48-api:
  #     endpoint: anthropic-opus4
  #     served_name: claude-opus-4-8
  #
  # A newly released Claude model is added HERE -- a `models:` entry with an
  # explicit `canonical:`, plus a top-level `rate_limit_buckets:` entry if its
  # bucket is not built in -- and needs no code change. Take its id from
  # GET /v1/models, which is free and returns the live list; never guess one.

models:
  # ARGO aliases. served_name defaults to the alias (ARGO's own model names),
  # and canonical identity comes from the built-in DEFAULT_CANONICAL table.
  gemini35flash:
    endpoint: argo
  gemini31flashlite:
    endpoint: argo
  gpt54:
    endpoint: argo
  gpt55:
    endpoint: argo
  claudesonnet5:
    endpoint: argo
  claudeopus45:
    endpoint: argo

  # Claude CLI. `sonnet` and `opus` are the CLI's own moving aliases; their
  # canonical identity is resolved from DEFAULT_CANONICAL's claude_cli table,
  # which is what makes sonnet-cli and the ARGO claudesonnet5 compare equal
  # and so refuse to sit in two independent seats.
  sonnet-cli:
    endpoint: claude
    served_name: sonnet
  opus-cli:
    endpoint: claude
    served_name: opus

  # Codex CLI. UNVERIFIED served names -- confirm with kbu council doctor
  # (operator step OP-2). verified: false until then, and canonical identity
  # is declared explicitly because these served names are not in the built-in
  # table under any spelling.
  gpt54-cli:
    endpoint: codex
    served_name: gpt-5.4
    canonical: openai/gpt-5.4
    verified: false
  gpt55-cli:
    endpoint: codex
    served_name: gpt-5.5
    canonical: openai/gpt-5.5
    verified: false

profiles:
  # All-ARGO: one API key's worth of billing, every seat a frontier model.
  argo:
    proposers: [gemini35flash, gpt54, gpt55]
    critic: claudesonnet5
    meta: claudeopus45

  # The default. Proposers and adjudicators are spread across an ARGO key and
  # two interactive subscriptions, so a batch costs almost nothing in API
  # tokens.
  mixed-subscription:
    proposers: [gemini35flash, gpt54-cli, gpt55-cli]
    critic: sonnet-cli
    meta: opus-cli

default_profile: mixed-subscription

# The store is a single SQLite file on LOCAL disk, one per machine -- there is
# no shared store and no database server. `~` is expanded at load time. A path
# inside a Dropbox directory is refused outright, and so is one on a network
# filesystem (NFS, SMB, sshfs, ...): live SQLite WAL files corrupt under file
# sync, and network filesystems do not give SQLite locks it can trust.
store: sqlite:///~/.kbutillib/council/council.sqlite

# Optional. The PROVENANCE label written to `jobs.submitted_by`; defaults to
# the OS user. It grants no access and gates nothing -- the queue and the
# budgets belong to the store, not to a person -- so changing it affects only
# the label on jobs submitted afterwards.
# user: someone

# Optional. Directories of query-type YAML files. Every *.yaml / *.yml
# DIRECTLY inside each one (non-recursive) is registered on every store open
# and by `kbu council db init`: an identical spec is a no-op, the same
# name@version with different content is refused naming the file, a missing
# directory is only a warning, and nothing is ever written into these
# directories -- they are expected to be in Dropbox. `~` and ${VAR} are
# expanded at load time.
# query_dirs:
#   - ~/Dropbox/Projects/council-queries
