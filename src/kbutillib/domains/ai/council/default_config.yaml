# Packaged default council configuration.
#
# Shipped as package data, so a fresh KBUtilLib install with no user config at
# all still has a working council. Override any entry from the `ai_council`
# section of ~/.kbutillib/config.yaml -- the user's keys win per endpoint,
# model and profile entry; entries they do not name are untouched.

endpoints:
  # ANL's ARGO gateway. OpenAI-compatible, and the only route that reaches
  # Gemini. ARGO authenticates by ANL username rather than an API key, which
  # is what user_env carries; proxy is empty unless the operator sets
  # KBU_ARGO_PROXY (ARGO is inside the lab network).
  argo:
    kind: argo
    base_url: https://apps.inside.anl.gov/argoapi/v1
    user_env: ARGO_USER
    proxy: ${KBU_ARGO_PROXY:-}

  # Headless CLIs. Both bill against an interactive subscription, not an API
  # key, so max_concurrency defaults to 1 for each: a CLI call is a
  # subprocess against one logged-in session, not a pooled API.
  claude:
    kind: claude_cli
    executable: claude
    account: claude-max
  codex:
    kind: codex_cli
    executable: codex
    account: codex-chatgpt

  # A SELF-HOSTED model is just an OpenAI-compatible endpoint you declare
  # yourself -- the council manages no models and knows no GPUs (review round
  # 2 took that out of the product). Nothing self-hosted is packaged here,
  # because a port that is up on one machine is not up on another. Uncomment
  # and edit, or put the same three lines in the `ai_council` section of
  # ~/.kbutillib/config.yaml, then seat the alias in a profile:
  #
  # my-vllm:
  #   kind: openai
  #   base_url: http://127.0.0.1:8000/v1
  #   api_key_env: MY_VLLM_API_KEY     # optional; vLLM ignores the value
  #                                    # unless it was started with --api-key

  # A gateway that routes on a HEADER rather than on the URL. The Genesis
  # Model Access Gateway (MAG) is OpenAI-compatible and picks which provider
  # to forward to from X-AmSC-MAG-Provider, so the provider travels in
  # options.headers -- a mapping of static, NON-SECRET headers sent on every
  # request this endpoint makes (both /chat/completions and /models). The
  # bearer token is NOT one of them: it comes from api_key_env, as always,
  # and a credential-shaped header name is refused at config load.
  #
  # The provider value below and the model ids to seat against it are NOT
  # guessed here: take both from the MyAmSC portal's MAG documentation for
  # your account, then declare the aliases under `models:` yourself with
  # `verified: false` until `kbu council doctor` has confirmed them. (That
  # key belongs to a model entry, not to an endpoint -- an endpoint has no
  # `verified` key and would warn and drop it.)
  #
  # mag:
  #   kind: openai
  #   base_url: https://mag.genesis.americansciencecloud.org/v1
  #   api_key_env: AMSC_TOKEN
  #   options:
  #     headers:
  #       X-AmSC-MAG-Provider: <provider>   # from the MyAmSC portal docs

  # ANTHROPIC'S OWN API (kind: anthropic) -- a fixed API credit spent through
  # POST /v1/messages. Needs `pip install 'kbutillib[anthropic]'` (Python >=
  # 3.10) and an API key in the variable api_key_env names; nothing else
  # carries the key. base_url is omitted: it defaults to
  # https://api.anthropic.com.
  #
  # ONE ALIAS PER RATE-LIMIT BUCKET -- not one per wallet, not one per model.
  # The `account` key names the RATE-LIMIT BUCKET, not the wallet. Anthropic
  # enforces requests/min and input/output tokens/min PER MODEL-CLASS BUCKET:
  # Opus 5, Sonnet 5 and Haiku 4.5 each hold a separate allowance, Opus
  # 4.8/4.7/4.6/4.5 share one, Sonnet 4.6/4.5 share another. The same
  # `account` key groups the engine's semaphore and rate pacer AND buckets the
  # dollar quote, so naming it after the wallet would throttle the run to the
  # slowest model's rate, and naming it per model would split one shared
  # allowance into independent pools -- which is how the 2026-10-21 MAG pilot
  # errored 427 of 500 items. Config load REFUSES an account that is not the
  # bucket name; billing_wallet names the payer (one value for every alias
  # paid from the same credit).
  #
  # NEITHER max_requests_per_minute NOR max_concurrency can express what binds
  # this provider. Anthropic limits requests/min AND input tokens/min AND
  # output tokens/min per bucket, and for a council's large prompts the TOKEN
  # limits bind first. max_requests_per_minute paces requests (set it from your
  # console's limits page, or measure it -- see the operator runbook) and
  # max_concurrency defaults low (4), but a correct value for both still does
  # not keep you inside the token limits. What catches that is the halt after
  # a sustained run of 429s: detection, not prevention. Setting
  # max_requests_per_minute does not mean "now I am within my limits".
  # Limits are per organisation/workspace, not per API key: several keys can
  # share one quota.
  #
  # max_total_tokens is PER ENDPOINT. Several aliases mean several budgets and
  # NOTHING SUMS THEM: a single fixed wallet is not expressible as one enforced
  # ceiling today. Setting a budget on each alias does not protect the wallet
  # as a whole -- fence it with a console spend limit as well.
  #
  # A seat's max_output_tokens must cover THINKING PLUS THE ANSWER. Thinking is
  # on by default and adaptive on the current Claude models, its tokens are
  # billed and counted as OUTPUT, and the seat default of 4000 is often not
  # enough; a truncated answer is a wasted call. `effort` may be passed in a
  # model's params to trade depth against spend; no value is chosen here.
  #
  # NO SAMPLING PARAMETER IS SENT BY DEFAULT: the current Claude models reject
  # temperature, top_p and top_k with HTTP 400. On a model that accepts them, a
  # seat may set one explicitly in its params -- the provider's default is
  # 1.0, not 0.
  #
  # This credit is a SECOND WALLET AT THE SAME PRICE, NOT A DISCOUNT: ARGO was
  # measured billing Claude at vendor list within 1.5% on the 2026-10-20 bill.
  # What it buys is independence from the ARGO cap and models ARGO does not
  # serve. ARGO already serves Sonnet 5 and Opus 5 under the SAME canonical
  # identity, so a roster cannot seat both routes for one model --
  # Roster._check_independence refuses it, deliberately, because that is what
  # stops one model being counted as two votes. The models this wallet newly
  # makes seatable are Haiku 4.5 and Sonnet 4.6.
  #
  # Dollar quotes: `rates` may be keyed per model as
  # "<account>/<canonical-model>", falling back to "<account>", and every rate
  # must carry a provenance. Claude Haiku 5.5's input pricing is TIERED BY
  # PROMPT SIZE, which a single input_per_mtok cannot express -- do not declare
  # a rate for it and expect an exact quote.
  #
  # anthropic-haiku:
  #   kind: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  #   billing: api
  #   account: anthropic-haiku-4.5          # = the bucket name, enforced
  #   billing_wallet: anthropic-credit
  #   max_concurrency: 4
  #   max_requests_per_minute: <rpm>        # your console's limit for this bucket
  # anthropic-sonnet4:
  #   kind: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  #   billing: api
  #   account: anthropic-sonnet-4           # Sonnet 4.6 / 4.5 share this bucket
  #   billing_wallet: anthropic-credit
  #   max_concurrency: 4
  #   max_requests_per_minute: <rpm>
  # anthropic-opus4:
  #   kind: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  #   billing: api
  #   account: anthropic-opus-4             # Opus 4.8 / 4.7 / 4.6 / 4.5 share this bucket
  #   billing_wallet: anthropic-credit
  #   max_concurrency: 4
  #   max_requests_per_minute: <rpm>
  #
  # ...with matching entries under `models:` (canonical identity comes from the
  # built-in DEFAULT_CANONICAL_BY_KIND["anthropic"] table):
  #
  #   haiku45-api:
  #     endpoint: anthropic-haiku
  #     served_name: claude-haiku-4-5
  #     params: {max_output_tokens: 16000}
  #   sonnet46-api:
  #     endpoint: anthropic-sonnet4
  #     served_name: claude-sonnet-4-6
  #   opus48-api:
  #     endpoint: anthropic-opus4
  #     served_name: claude-opus-4-8
  #
  # A newly released Claude model is added HERE -- a `models:` entry with an
  # explicit `canonical:`, plus a top-level `rate_limit_buckets:` entry if its
  # bucket is not built in -- and needs no code change. Take its id from
  # GET /v1/models, which is free and returns the live list; never guess one.

  # >>> BEGIN ALCF BLOCK (commented; the packaged config declares no live ALCF endpoint) >>>
  #
  # ALCF INFERENCE ENDPOINTS (kind: alcf) -- a SECOND ROUTE, chosen per job.
  # This is an ADDITION, not a migration: councils keep running against
  # frontier models through ARGO, Anthropic and the CLIs. Nothing below is
  # live. It spans four top-level keys (endpoints, models, profiles, rates):
  # uncomment each part under the matching key in this file or in the
  # `ai_council` section of ~/.kbutillib/config.yaml.
  #
  # ENDPOINTS. One per cluster in use. An alcf endpoint is addressed as
  # {service_root}/{cluster}/{framework}/v1, so options.cluster and
  # options.framework are required and base_url is DERIVED (under
  # https://inference-api.alcf.anl.gov/resource_server); declare exactly one
  # token source. The command below is the argv confirmed live on 2026-11-14
  # (agent-io/work-records/alcf-live-smoke.md): it exits 0 and prints one
  # 91-character opaque Globus token on a single line. It is run WITHOUT a
  # shell, so it is a list; the worker's PATH must resolve `alcf-tokens`.
  #
  # NO SOPHIA ENDPOINT AND NO SOPHIA MODEL. On 2026-11-12 all nine Sophia chat
  # models failed, mostly HTTP 503 internal_endpoint_error in under a second
  # -- "no backend", not a cold start. That removes Meta's Llama line,
  # Mixtral, Trinity and AuroraGPT from the pool. Worth reporting to ALCF.
  #
  # account: alcf-inference on ALL of them, deliberately shared. ALCF's
  # binding limit is 20 requests/second per CALLER, account-wide, and both the
  # rate pacer and quote._gateway_of key on `account`, so one shared name makes
  # one shared pacer. THE HONEST LIMIT: the pacer's state lives INSIDE one
  # worker, so a shared account bounds ONE worker's rate, not the caller's.
  # Several queue workers, or any other client on the same Globus identity,
  # can exceed 20/s together. The halt after a sustained run of 429s is the
  # backstop (detection, not prevention).
  #
  # timeout: 300. DEFAULT_TIMEOUT_S is 180 and real calls needed more
  # (inkling-bf16 took 28-52s, beam-1.0-fp8 15.9-30.6s). max_requests_per_minute
  # 1200 is the 20/s ceiling expressed per minute.
  #
  # alcf-tara:
  #   kind: alcf
  #   account: alcf-inference
  #   timeout: 300
  #   max_requests_per_minute: 1200
  #   options:
  #     cluster: tara
  #     framework: api
  #     token_command: [alcf-tokens, get-token, inference]
  #     # request_response_format defaults to true for this kind. Keep it:
  #     # gemma-4-31B-it-262k is UNPARSEABLE without response_format.
  # alcf-metis:
  #   kind: alcf
  #   account: alcf-inference
  #   timeout: 300
  #   max_requests_per_minute: 1200
  #   options:
  #     cluster: metis
  #     framework: api
  #     token_command: [alcf-tokens, get-token, inference]
  # alcf-minerva:
  #   kind: alcf
  #   account: alcf-inference
  #   timeout: 300
  #   max_requests_per_minute: 1200
  #   options:
  #     cluster: minerva
  #     framework: api
  #     token_command: [alcf-tokens, get-token, inference]
  #
  # MODELS (go under `models:`). Bench A's measured seating, which ran 495 of
  # 500 items through the real engine. Every alcf seat MUST carry an explicit
  # max_output_tokens (or max_tokens) >= 32000 under `params:`; config load
  # refuses it otherwise, because a reasoning model can spend its whole ceiling
  # on hidden reasoning tokens (max_tokens caps TOTAL generated tokens, and
  # completion_tokens is inclusive of reasoning). The five spellings below are
  # in the built-in canonical table for kind alcf, so no `canonical:` is
  # needed; an alcf model outside that table needs an explicit `canonical:`.
  # Note tara's model ids are vendor-prefixed (openai/gpt-oss-120b) while
  # metis's are not.
  #
  #   gpt-oss-120b@tara:               # proposer; 2.4s, ~475 completion tokens
  #     endpoint: alcf-tara
  #     served_name: openai/gpt-oss-120b
  #     params: {max_output_tokens: 32000}
  #   gpt-oss-20b@tara:                # proposer; 1.3-5.7s, 367-1737 tokens
  #     endpoint: alcf-tara
  #     served_name: openai/gpt-oss-20b
  #     params: {max_output_tokens: 32000}
  #   gemma-4-31B-it-262k@tara:        # proposer; 1.7s, ~78 tokens. UNPARSEABLE
  #     endpoint: alcf-tara            # without response_format, which is why
  #     served_name: google/gemma-4-31B-it-262k   # options.request_response_format
  #     params: {max_output_tokens: 32000}        # defaults true for this kind
  #   beam-1.0-fp8@tara:               # critic; 15.9-30.6s, 2235-4750 tokens
  #     endpoint: alcf-tara
  #     served_name: beam-1.0-fp8
  #     params: {max_output_tokens: 32000}
  #   inkling-bf16@tara:               # meta; 28.8-52.4s, 1285-2266 tokens
  #     endpoint: alcf-tara
  #     served_name: inkling-bf16
  #     params: {max_output_tokens: 32000}
  #
  # FAILOVER ROUTES, not extra seats: the same models on metis, for use when
  # tara is down. They share canonicals with their tara twins, so
  # Roster._check_independence REFUSES them as ADDITIONAL proposers (one
  # model must not be counted as two votes). Swap one in for its twin.
  #
  #   gpt-oss-120b@metis:
  #     endpoint: alcf-metis
  #     served_name: gpt-oss-120b
  #     params: {max_output_tokens: 32000}
  #   gemma-4-31B-it@metis:
  #     endpoint: alcf-metis
  #     served_name: gemma-4-31B-it
  #     params: {max_output_tokens: 32000}
  #
  # PROFILE (goes under `profiles:`). SEATING RATIONALE: it mirrors the live
  # frontier bench's STRUCTURE -- two sizes of one vendor plus one other among
  # the proposers (the live bench pairs gpt-5.6-sol and gpt-5.6-luna) -- so the
  # comparison isolates ONE variable, open versus frontier models. A
  # maximum-diversity bench changes models and structure at once and answers a
  # different question; nemotron-35-super-vl, mistral-large-4-nvfp4@minerva and
  # muse-spark-bf16 are its unseated pool. All three proposer slots are filled.
  #
  #   alcf-open:
  #     proposers: [gpt-oss-120b@tara, gpt-oss-20b@tara, gemma-4-31B-it-262k@tara]
  #     critic: beam-1.0-fp8@tara
  #     meta: inkling-bf16@tara
  #
  # DO NOT SEAT Mistral-Large-3-675B-Instruct-2512 (metis). It returns a
  # complete JSON object, then prose, then a SECOND object selecting a
  # DIFFERENT GO term; response_format does not fix it (metis accepts and
  # ignores the parameter for this model).
  #
  # LATENCY. Do not assign a seat on one burst of latency: beam-1.0-fp8
  # measured 15.9s, 22.1s and 30.6s on comparable work. At concurrency 8 over
  # 48,437 items a 2.4s proposer is about 4 hours and a 26s one about 44.
  #
  # CONCURRENCY. The 500-item run used 16 and sustained only ~1 request/s
  # against the 20/s limit, so CONCURRENCY binds and the rate cap does not.
  # Raising concurrency is the throughput lever; watch for 429s on the shared
  # capacity.
  #
  # FULL CORPUS. Both constraints are load-bearing. (1) Run it through
  # `kbu ontomap council-run`, not a direct submit, staged in ~2,000-item
  # chunks with ONE chunk in flight: claim_calls cost is LINEAR in the pending
  # set (217ms at 19k pending vs 10.4ms at 2k) and previously inflated service
  # times 6-9x. (2) Use a FRESH STORE: the live store is 1.57 GB over 331,613
  # calls and its 48,437 verdicts are the comparison baseline. Expected:
  # 4.85 s/item at concurrency 16, about 65 h and ~212M completion tokens for
  # 48,437 items.
  #
  # RATES (goes at the top level, beside `endpoints:`). Free and unlimited for
  # ANL work (Chris, 2026-11-11). This is deliberately NOT a built-in default:
  # RateConfig is opt-in and never guessed, and shipped code asserting a
  # provider is free would keep asserting it after the policy changed. Keyed
  # by the gateway, i.e. the shared `account`.
  #
  # rates:
  #   alcf-inference:
  #     input_per_mtok: 0
  #     output_per_mtok: 0
  #     provenance: "free and unlimited for ANL work (Chris, 2026-11-11)"
  #
  # DEPLOYMENT. No new Python wheel is needed in any venv, but `alcf-tokens`
  # must be on the worker's PATH (it lives in its own uv tool venv and is not
  # importable from the council venv). The token hook is SYNCHRONOUS, so a slow
  # token tool can freeze the worker's event loop for up to
  # options.token_timeout_s (default 30). The Globus refresh token expires
  # after 30 days without use and that is not readable without a login. A
  # RUNNING WORKER MUST BE RESTARTED after this lands: CouncilWorker caches
  # each endpoint's servability for its life, so existing workers (frontier
  # ones included) keep the old readiness reading until restarted.
  #
  # <<< END ALCF BLOCK <<<

models:
  # ARGO aliases. served_name defaults to the alias (ARGO's own model names),
  # and canonical identity comes from the built-in DEFAULT_CANONICAL table.
  gemini35flash:
    endpoint: argo
  gemini31flashlite:
    endpoint: argo
  gpt54:
    endpoint: argo
  gpt55:
    endpoint: argo
  claudesonnet5:
    endpoint: argo
  claudeopus45:
    endpoint: argo

  # Claude CLI. `sonnet` and `opus` are the CLI's own moving aliases; their
  # canonical identity is resolved from DEFAULT_CANONICAL's claude_cli table,
  # which is what makes sonnet-cli and the ARGO claudesonnet5 compare equal
  # and so refuse to sit in two independent seats.
  sonnet-cli:
    endpoint: claude
    served_name: sonnet
  opus-cli:
    endpoint: claude
    served_name: opus

  # Codex CLI. UNVERIFIED served names -- confirm with kbu council doctor
  # (operator step OP-2). verified: false until then, and canonical identity
  # is declared explicitly because these served names are not in the built-in
  # table under any spelling.
  gpt54-cli:
    endpoint: codex
    served_name: gpt-5.4
    canonical: openai/gpt-5.4
    verified: false
  gpt55-cli:
    endpoint: codex
    served_name: gpt-5.5
    canonical: openai/gpt-5.5
    verified: false

profiles:
  # All-ARGO: one API key's worth of billing, every seat a frontier model.
  argo:
    proposers: [gemini35flash, gpt54, gpt55]
    critic: claudesonnet5
    meta: claudeopus45

  # The default. Proposers and adjudicators are spread across an ARGO key and
  # two interactive subscriptions, so a batch costs almost nothing in API
  # tokens.
  mixed-subscription:
    proposers: [gemini35flash, gpt54-cli, gpt55-cli]
    critic: sonnet-cli
    meta: opus-cli

default_profile: mixed-subscription

# The store is a single SQLite file on LOCAL disk, one per machine -- there is
# no shared store and no database server. `~` is expanded at load time. A path
# inside a Dropbox directory is refused outright, and so is one on a network
# filesystem (NFS, SMB, sshfs, ...): live SQLite WAL files corrupt under file
# sync, and network filesystems do not give SQLite locks it can trust.
store: sqlite:///~/.kbutillib/council/council.sqlite

# Optional. The PROVENANCE label written to `jobs.submitted_by`; defaults to
# the OS user. It grants no access and gates nothing -- the queue and the
# budgets belong to the store, not to a person -- so changing it affects only
# the label on jobs submitted afterwards.
# user: someone

# Optional. Directories of query-type YAML files. Every *.yaml / *.yml
# DIRECTLY inside each one (non-recursive) is registered on every store open
# and by `kbu council db init`: an identical spec is a no-op, the same
# name@version with different content is refused naming the file, a missing
# directory is only a warning, and nothing is ever written into these
# directories -- they are expected to be in Dropbox. `~` and ${VAR} are
# expanded at load time.
# query_dirs:
#   - ~/Dropbox/Projects/council-queries
