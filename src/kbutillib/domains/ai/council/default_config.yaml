# Packaged default council configuration.
#
# Shipped as package data, so a fresh KBUtilLib install with no user config at
# all still has a working council. Override any entry from the `ai_council`
# section of ~/.kbutillib/config.yaml -- the user's keys win per endpoint,
# model and profile entry; entries they do not name are untouched.

endpoints:
  # ANL's ARGO gateway. OpenAI-compatible, and the only route that reaches
  # Gemini. ARGO authenticates by ANL username rather than an API key, which
  # is what user_env carries; proxy is empty unless the operator sets
  # KBU_ARGO_PROXY (ARGO is inside the lab network).
  argo:
    kind: argo
    base_url: https://apps.inside.anl.gov/argoapi/v1
    user_env: ARGO_USER
    proxy: ${KBU_ARGO_PROXY:-}

  # Headless CLIs. Both bill against an interactive subscription, not an API
  # key, so max_concurrency defaults to 1 for each: a CLI call is a
  # subprocess against one logged-in session, not a pooled API.
  claude:
    kind: claude_cli
    executable: claude
    account: claude-max
  codex:
    kind: codex_cli
    executable: codex
    account: codex-chatgpt

  # Self-hosted vLLM servers on poplar, one port per model. `supervisor: true`
  # means the port has a control plane that can report whether its model is
  # loaded, starting, stopped or failed, so a seat can wait rather than fail.
  #
  # STATIC for M1: these nine endpoints are hard-coded here. A later milestone
  # adds a `poplar_registry` endpoint kind backed by the shared model registry,
  # which discovers ports and lifecycle state instead of assuming them.
  gpt-oss-120b:
    kind: openai
    base_url: http://poplar.cels.anl.gov:8301/v1
    supervisor: true
  qwen3-32b:
    kind: openai
    base_url: http://poplar.cels.anl.gov:8302/v1
    supervisor: true
  llama-3.3-70b:
    kind: openai
    base_url: http://poplar.cels.anl.gov:8303/v1
    supervisor: true
  mistral-small-3.2:
    kind: openai
    base_url: http://poplar.cels.anl.gov:8304/v1
    supervisor: true
  qwen3-235b:
    kind: openai
    base_url: http://poplar.cels.anl.gov:8305/v1
    supervisor: true
  qwen3.8-27b:
    kind: openai
    base_url: http://poplar.cels.anl.gov:8306/v1
    supervisor: true
  gemma-4-31b:
    kind: openai
    base_url: http://poplar.cels.anl.gov:8307/v1
    supervisor: true
  nemotron-3-super:
    kind: openai
    base_url: http://poplar.cels.anl.gov:8308/v1
    supervisor: true
  qwen3.5-122b:
    kind: openai
    base_url: http://poplar.cels.anl.gov:8309/v1
    supervisor: true

models:
  # ARGO aliases. served_name defaults to the alias (ARGO's own model names),
  # and canonical identity comes from the built-in DEFAULT_CANONICAL table.
  gemini35flash:
    endpoint: argo
  gemini31flashlite:
    endpoint: argo
  gpt54:
    endpoint: argo
  gpt55:
    endpoint: argo
  claudesonnet5:
    endpoint: argo
  claudeopus45:
    endpoint: argo

  # Claude CLI. `sonnet` and `opus` are the CLI's own moving aliases; their
  # canonical identity is resolved from DEFAULT_CANONICAL's claude_cli table,
  # which is what makes sonnet-cli and the ARGO claudesonnet5 compare equal
  # and so refuse to sit in two independent seats.
  sonnet-cli:
    endpoint: claude
    served_name: sonnet
  opus-cli:
    endpoint: claude
    served_name: opus

  # Codex CLI. UNVERIFIED served names -- confirm with kbu council doctor
  # (operator step OP-2). verified: false until then, and canonical identity
  # is declared explicitly because these served names are not in the built-in
  # table under any spelling.
  gpt54-cli:
    endpoint: codex
    served_name: gpt-5.4
    canonical: openai/gpt-5.4
    verified: false
  gpt55-cli:
    endpoint: codex
    served_name: gpt-5.5
    canonical: openai/gpt-5.5
    verified: false

  # Poplar self-hosted models. canonical is declared explicitly: these are
  # local deployments, so "poplar/<alias>" is their identity and nothing in
  # the built-in vendor table applies.
  gpt-oss-120b:
    endpoint: gpt-oss-120b
    canonical: poplar/gpt-oss-120b
  qwen3-32b:
    endpoint: qwen3-32b
    canonical: poplar/qwen3-32b
  llama-3.3-70b:
    endpoint: llama-3.3-70b
    canonical: poplar/llama-3.3-70b
  mistral-small-3.2:
    endpoint: mistral-small-3.2
    canonical: poplar/mistral-small-3.2
  qwen3-235b:
    endpoint: qwen3-235b
    canonical: poplar/qwen3-235b
  qwen3.8-27b:
    endpoint: qwen3.8-27b
    canonical: poplar/qwen3.8-27b
  gemma-4-31b:
    endpoint: gemma-4-31b
    canonical: poplar/gemma-4-31b
  nemotron-3-super:
    endpoint: nemotron-3-super
    canonical: poplar/nemotron-3-super
  qwen3.5-122b:
    endpoint: qwen3.5-122b
    canonical: poplar/qwen3.5-122b

profiles:
  # All-ARGO: one API key's worth of billing, every seat a frontier model.
  argo:
    proposers: [gemini35flash, gpt54, gpt55]
    critic: claudesonnet5
    meta: claudeopus45

  # The default. Proposers and adjudicators are spread across an ARGO key and
  # two interactive subscriptions, so a batch costs almost nothing in API
  # tokens.
  mixed-subscription:
    proposers: [gemini35flash, gpt54-cli, gpt55-cli]
    critic: sonnet-cli
    meta: opus-cli

  # Entirely self-hosted: no external billing and no data leaving the lab.
  poplar-local:
    proposers: [qwen3.8-27b, gemma-4-31b, nemotron-3-super]
    critic: mistral-small-3.2
    meta: qwen3.5-122b

default_profile: mixed-subscription

# Local SQLite by default. `~` is expanded at load time, and a sqlite store
# inside a Dropbox directory is refused outright: live WAL files corrupt under
# file sync. Point this at a PostgreSQL URL to share a store across the fleet.
store: sqlite:///~/.kbutillib/council/council.sqlite
