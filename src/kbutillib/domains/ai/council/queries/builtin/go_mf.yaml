    Matches the SHA-256 the task pinned. Its PROPOSER_USER, CRITIC_SYSTEM,
    CRITIC_USER, META_SYSTEM and META_USER are byte-identical to the V3 kit's.
    Its PROPOSER_SYSTEM is NOT: the live pilot has moved past V3 and carries
