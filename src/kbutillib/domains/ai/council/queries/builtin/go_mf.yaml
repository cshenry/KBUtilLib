    50-147  PROPOSER_SYSTEM, PROPOSER_USER, CRITIC_SYSTEM, CRITIC_USER,
            META_SYSTEM, META_USER -- the six prompt strings below, byte for byte
    152-159 render_candidates() -- the full and short candidate blocks
    296-362 run_one() -- candidate blocks, vote table and per-proposer reasoning
    364-379 run_one() -- the critic prompt assembly
