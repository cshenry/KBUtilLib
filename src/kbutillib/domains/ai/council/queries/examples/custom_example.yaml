name: ec_number_example
version: '1'
description: 'Worked example of a user-registered query type: assign Enzyme Commission numbers to an annotation string from a closed menu. Everything here is in the spec -- it names no builtin renderer, so it is rendered by the package''s string.Template renderer and must use the package''s generic answer schemas with only the id field renamed (ec_id, final_ec_ids). Note that the template renderer is unconditional: a candidate with no description renders an empty last column rather than dropping the separator, which is the price of a renderer that cannot run logic.'
entity_field: annotation
evidence_fields:
- annotation
- organism
menu_fields:
- definition_source
id_field: ec_id
renderer: null
adapter: null
critic_truncate_chars: 1200
candidate_templates:
  full: '  $rank | $id | $score | $label | $description'
  short: '  $rank | $id | $label'
roles:
  proposer:
    system: |-
      You assign Enzyme Commission numbers to protein annotation strings.

      You are given one annotation string, the organism it came from, and a ranked list of candidate EC numbers retrieved for it. Choose the candidates the annotation actually supports.

      Rules:
      - Pick ONLY from the candidate list. Never invent an EC number.
      - Prefer the most specific candidate the annotation genuinely supports. A partial EC (one ending in .-) is right only when the annotation really does leave the last level open.
      - A multifunctional enzyme can carry several EC numbers. Pick all that apply.
      - The retrieval score reflects text similarity only. It is evidence, not an answer.
      - Some annotation strings are bare locus tags or hypothetical-protein placeholders and state no function at all. Pick nothing and say so rather than guessing.

      Return JSON only. No prose, no markdown fences.
    user: |-
      Annotation string: "$annotation"
      Organism: $organism

      Candidate EC numbers (rank | EC | score | name | definition):
      $candidates_full

      Return JSON exactly matching:
      {
        "picked": [
          {"ec_id": "<one of the candidate ids>",
           "confidence": "high|medium|low",
           "why": "<one sentence tying the annotation to the EC>"}
        ],
        "overall_confidence": "high|medium|low",
        "no_functional_content": <true if the string states no function, else false>,
        "notes": "<optional, one sentence>"
      }

      Return ONLY the JSON object.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: council proposer answer
      type: object
      additionalProperties: false
      required:
      - picked
      - overall_confidence
      - no_functional_content
      properties:
        picked:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - ec_id
            - confidence
            - why
            properties:
              confidence:
                enum:
                - high
                - medium
                - low
              why:
                type: string
              ec_id:
                type: string
                description: one of the ids offered on the closed menu
        overall_confidence:
          enum:
          - high
          - medium
          - low
        no_functional_content:
          type: boolean
        notes:
          type: string
  critic:
    system: |-
      You audit a council's EC number assignments. You do not assign EC numbers yourself.

      For the annotation string and the council's vote table, judge whether the votes are justified, and flag two specific failures:
      - an EC picked that the annotation does not support, especially one chosen because its wording overlaps rather than its chemistry
      - a clearly correct candidate the council overlooked

      Return JSON only. No prose, no markdown fences.
    user: |-
      Annotation string: "$annotation"
      Organism: $organism

      Candidates offered (rank | EC | name):
      $candidates_short

      Council votes (EC : how many proposers picked it):
      $votes

      Per-proposer reasoning:
      $ballots

      Return JSON exactly matching:
      {
        "verdict": "strongly_consistent|consistent|ambiguous|inconsistent",
        "reason": "<one to two sentences>",
        "overpicked": ["<EC the council should not have picked>"],
        "missed": ["<candidate EC the council should have picked>"],
        "contentless_input": <true if the string states no function>
      }

      Return ONLY the JSON object.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: council critic answer
      type: object
      additionalProperties: false
      required:
      - verdict
      - reason
      - overpicked
      - missed
      - contentless_input
      properties:
        verdict:
          enum:
          - strongly_consistent
          - consistent
          - ambiguous
          - inconsistent
        reason:
          type: string
        overpicked:
          type: array
          items:
            type: string
        missed:
          type: array
          items:
            type: string
        contentless_input:
          type: boolean
  meta:
    system: |-
      You are the final arbiter for EC number assignment. The council disagreed, so you decide.

      You see the annotation string, the candidates, every proposer's picks and reasoning, and the critic's audit. Issue the final set.

      You are not bound by majority vote. Prefer the most specific defensible EC. Assign nothing when the string carries no functional claim. A biologist reviews these, so a defensible smaller set beats a speculative larger one.

      Return JSON only. No prose, no markdown fences.
    user: |-
      Annotation string: "$annotation"
      Organism: $organism

      Candidates (rank | EC | score | name | definition):
      $candidates_full

      Council votes:
      $votes

      Per-proposer reasoning:
      $ballots

      Critic audit:
      $critic_json

      Return JSON exactly matching:
      {
        "final_ec_ids": ["<EC>", ...],
        "final_confidence": "high|medium|low",
        "no_functional_content": <true or false>,
        "reasoning": "<paragraph explaining the call and how the disagreement was resolved>"
      }

      Return ONLY the JSON object.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: council meta answer
      type: object
      additionalProperties: false
      required:
      - final_ec_ids
      - final_confidence
      - no_functional_content
      - reasoning
      properties:
        final_confidence:
          enum:
          - high
          - medium
          - low
        no_functional_content:
          type: boolean
        reasoning:
          type: string
        final_ec_ids:
          type: array
          items:
            type: string
attribution: 'Written for this package as a worked example. The prompt WORDING is modelled on Jose Faria''s CONCORDIA GO council V3 (the closed-menu shape, the decline-on-contentless rule, the critic''s two named failure modes), but no text is ported: the two shipped builtins are the verbatim ports, and this file exists to show the template renderer and its closed binding list.'
